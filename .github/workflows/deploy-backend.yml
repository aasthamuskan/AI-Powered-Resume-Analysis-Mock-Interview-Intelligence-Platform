# ─────────────────────────────────────────────────────────────────────────────
# Deploy Backend → Render.com
# Runs only when main branch is pushed with Backend changes
# Calls the Render deploy hook URL to trigger a new deploy
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Backend → Render

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'          # only trigger when backend code changes
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Syntax check before deploy
        working-directory: Backend
        run: node --check server.js

      - name: Trigger Render Deploy Hook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --fail \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Render deploy triggered successfully"

      - name: Notify deploy status
        if: failure()
        run: echo "❌ Backend deploy failed — check Render dashboard"

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO SET UP (one-time):
#
# 1. Go to your Render dashboard → your backend service
# 2. Click Settings → Deploy Hook → Copy the URL
#
# 3. Add this GitHub Secret (Settings → Secrets → Actions):
#    RENDER_DEPLOY_HOOK_URL → the full deploy hook URL from Render
#
# Render auto-deploys from the hook URL (no credentials needed in the URL itself).
# ─────────────────────────────────────────────────────────────────────────────
