# ─────────────────────────────────────────────────────────────────────────────
# Deploy Backend → Render.com
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Backend → Render

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Guard: skip if secret not configured ──────────────────────────────
      - name: Check required secrets
        id: check-secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js 20
        if: steps.check-secrets.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend dependencies
        if: steps.check-secrets.outputs.skip == 'false'
        working-directory: Backend
        run: npm ci

      - name: Syntax check before deploy
        if: steps.check-secrets.outputs.skip == 'false'
        working-directory: Backend
        run: node --check server.js

      - name: Trigger Render Deploy Hook
        if: steps.check-secrets.outputs.skip == 'false'
        shell: bash
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Render deploy triggered — HTTP $HTTP_STATUS"
          else
            echo "❌ Render deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Deploy skipped notice
        if: steps.check-secrets.outputs.skip == 'true'
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║  DEPLOY SKIPPED — Secret not configured yet         ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  Add this in: Settings → Secrets → Actions          ║"
          echo "║                                                      ║"
          echo "║  RENDER_DEPLOY_HOOK_URL                             ║"
          echo "║  → Render Dashboard → Service → Settings            ║"
          echo "║    → Deploy Hook → Generate & copy URL              ║"
          echo "╚══════════════════════════════════════════════════════╝"
